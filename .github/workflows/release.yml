name: release

on:
  push:
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Server tests
        run: cargo test --manifest-path server/Cargo.toml
      - name: Extension builds
        run: cargo build --release --target wasm32-wasip2

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14, zip: false }
          - { target: x86_64-apple-darwin, os: macos-14, zip: false }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, zip: false }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, zip: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, zip: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --manifest-path server/Cargo.toml --target ${{ matrix.target }}
      - name: Package (tar.gz)
        if: ${{ !matrix.zip }}
        shell: bash
        run: |
          mkdir dist
          tar -czf "dist/panoptic-lsp-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            -C "server/target/${{ matrix.target }}/release" panoptic-lsp
      - name: Package (zip)
        if: ${{ matrix.zip }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path "server/target/${{ matrix.target }}/release/panoptic-lsp.exe" `
            -DestinationPath "dist/panoptic-lsp-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: panoptic-lsp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match extension.toml and server version
        run: |
          ext=$(sed -n 's/^version = "\(.*\)"/\1/p' extension.toml | head -n1)
          srv=$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -n1)
          [ "v$ext" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != extension.toml v$ext"; exit 1; }
          [ "$srv" = "$ext" ] || { echo "server version $srv != extension version $ext"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: All assets present
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -f "dist/panoptic-lsp-$GITHUB_REF_NAME-$t.tar.gz" || { echo "missing $t"; exit 1; }
          done
          test -f "dist/panoptic-lsp-$GITHUB_REF_NAME-x86_64-pc-windows-msvc.zip" || { echo "missing windows"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
