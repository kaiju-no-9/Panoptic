[package]
name = "panoptic-lsp"
version = "0.1.0"
edition = "2021"
description = "Native Markdown language server for the Panoptic Zed extension"
license = "MIT"
publish = false

[lib]
name = "panoptic_lsp"
path = "src/lib.rs"

[[bin]]
name = "panoptic-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "0.7"
lsp-types = "0.95"
pulldown-cmark = { version = "0.13", default-features = false }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
